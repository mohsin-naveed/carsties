<section class="hero" aria-label="Carsties marketplace" appRevealOnScroll>
  <div class="hero__bg" aria-hidden="true"></div>

  <div class="hero__container">
    <div class="hero__grid">
      <div class="hero__copy" appRevealOnScroll>
        <h1 class="mat-display-large hero__title">Find your next car with confidence</h1>
        <p class="mat-body-large hero__subtitle">
          Browse modern listings with clean filters, premium presentation, and a fast search experience.
        </p>

        <div class="hero__actions" role="group" aria-label="Primary actions">
          <a mat-raised-button color="primary" [routerLink]="['/search']">
            <mat-icon aria-hidden="true">search</mat-icon>
            Browse Cars
          </a>
          <a mat-stroked-button color="primary" [routerLink]="['/sell']">
            <mat-icon aria-hidden="true">sell</mat-icon>
            Sell Your Car
          </a>
        </div>
      </div>

      <div class="hero__search" appRevealOnScroll>
        <app-hero-search></app-hero-search>
      </div>
    </div>
  </div>
</section>

<section class="section section--browse" aria-label="Browse categories" appRevealOnScroll>
  <div class="section__header">
    <h2 class="mat-headline-medium section__title">Browse by Category</h2>
    <p class="mat-body-medium section__subtitle">Jump into the most common segments.</p>
  </div>
  <app-browse-tabs></app-browse-tabs>
</section>

<section class="section" aria-label="Featured" appRevealOnScroll>
  <app-featured-listings></app-featured-listings>
  <app-sell-your-car></app-sell-your-car>
</section>
