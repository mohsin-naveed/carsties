<mat-tab-group aria-label="Browse used cars">
  <mat-tab label="Make">
    <div class="browse-grid">
      <mat-card
        class="browse-card"
        *ngFor="let m of (makes$ | async); trackBy: trackByCode"
        (click)="goToMake(m.code)"
        tabindex="0"
        role="link"
        (keyup.enter)="goToMake(m.code)"
        (keyup.space)="goToMake(m.code)"
        [attr.aria-label]="'Browse make ' + m.name"
      >
        <mat-icon class="browse-card__icon" aria-hidden="true">factory</mat-icon>
        <div class="browse-card__title">{{ m.name }}</div>
        <div class="browse-card__count">{{ m.count }} listings</div>
      </mat-card>
    </div>
  </mat-tab>
  <mat-tab label="Model">
    <div class="browse-grid">
      <mat-card
        class="browse-card"
        *ngFor="let m of (models$ | async); trackBy: trackByCode"
        (click)="goToModel(m.code)"
        tabindex="0"
        role="link"
        (keyup.enter)="goToModel(m.code)"
        (keyup.space)="goToModel(m.code)"
        [attr.aria-label]="'Browse model ' + m.name"
      >
        <mat-icon class="browse-card__icon" aria-hidden="true">directions_car</mat-icon>
        <div class="browse-card__title">{{ m.name }}</div>
        <div class="browse-card__count">{{ m.count }} listings</div>
      </mat-card>
    </div>
  </mat-tab>
  <mat-tab label="Body Type">
    <div class="browse-grid">
      <mat-card
        class="browse-card"
        *ngFor="let b of (bodies$ | async); trackBy: trackByCode"
        (click)="goToBody(b.code)"
        tabindex="0"
        role="link"
        (keyup.enter)="goToBody(b.code)"
        (keyup.space)="goToBody(b.code)"
        [attr.aria-label]="'Browse body type ' + b.name"
      >
        <mat-icon class="browse-card__icon" aria-hidden="true">category</mat-icon>
        <div class="browse-card__title">{{ b.name }}</div>
        <div class="browse-card__count">{{ b.count }} listings</div>
      </mat-card>
    </div>
  </mat-tab>
</mat-tab-group>
