<mat-toolbar color="primary" class="app-toolbar" role="navigation" aria-label="Primary">
  <button class="nav__mobile-toggle" mat-icon-button [matMenuTriggerFor]="mobileMenu" aria-label="Open navigation">
    <mat-icon>menu</mat-icon>
  </button>
  <a class="nav__brand" [routerLink]="['/']" style="text-decoration:none; color:inherit; cursor:pointer;">
    <mat-icon aria-hidden="true">directions_car</mat-icon>
    <strong>Carsties</strong>
  </a>
  <nav class="nav__links" aria-label="Main">
    <button mat-button [routerLink]="['/search']">Buy</button>
    <button mat-button [routerLink]="['/sell']">Sell</button>
    <button mat-button [routerLink]="['/dealers']">Dealers</button>
    <button mat-button [routerLink]="['/']" fragment="reviews">Reviews</button>
  </nav>
  <span class="spacer"></span>
  <button mat-icon-button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle dark mode">
    <mat-icon *ngIf="!(isDarkMode$ | async); else darkIcon">dark_mode</mat-icon>
    <ng-template #darkIcon><mat-icon>light_mode</mat-icon></ng-template>
  </button>
  <div class="nav__auth">
    <ng-container *ngIf="isAuthenticated$ | async; else loggedOutDesktop">
      <button mat-icon-button [matMenuTriggerFor]="accountMenu" aria-label="Account menu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #accountMenu="matMenu">
        <button mat-menu-item [routerLink]="['/complete-profile']">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item [routerLink]="['/my-listings']">
          <mat-icon>list</mat-icon>
          <span>My Listings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </ng-container>
    <ng-template #loggedOutDesktop>
      <button mat-stroked-button (click)="login()">Login</button>
      <button mat-raised-button color="primary" [matMenuTriggerFor]="registerMenu">Register</button>
    </ng-template>
    <a mat-raised-button color="warn" [routerLink]="['/sell']" class="link-sell">Sell your car</a>
    <mat-menu #registerMenu="matMenu">
      <button mat-menu-item (click)="register('Individual')">Register as Individual</button>
      <button mat-menu-item (click)="register('Dealer')">Register as Dealer</button>
    </mat-menu>
  </div>
</mat-toolbar>

<mat-menu #mobileMenu="matMenu">
  <button mat-menu-item [routerLink]="['/search']"><mat-icon>search</mat-icon> <span>Buy</span></button>
  <button mat-menu-item [routerLink]="['/sell']"><mat-icon>sell</mat-icon> <span>Sell your car</span></button>
  <button mat-menu-item [routerLink]="['/dealers']"><mat-icon>store</mat-icon> <span>Dealers</span></button>
  <button mat-menu-item [routerLink]="['/']" fragment="reviews"><mat-icon>star</mat-icon> <span>Reviews</span></button>
  <mat-divider></mat-divider>
  <ng-container *ngIf="isAuthenticated$ | async; else mobileLoggedOut">
    <button mat-menu-item [routerLink]="['/complete-profile']"><mat-icon>person</mat-icon> <span>Profile</span></button>
    <button mat-menu-item [routerLink]="['/my-listings']"><mat-icon>list</mat-icon> <span>My Listings</span></button>
    <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> <span>Logout</span></button>
  </ng-container>
  <ng-template #mobileLoggedOut>
    <button mat-menu-item (click)="login()">Login</button>
    <button mat-menu-item [matMenuTriggerFor]="registerMenu">Register</button>
  </ng-template>
  <!-- Removed CTA button; keep primary Sell route in main links -->
</mat-menu>

<main class="page-container">
  <section class="page-content">
    <router-outlet></router-outlet>
  </section>
</main>

<app-footer></app-footer>
