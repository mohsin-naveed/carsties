<mat-toolbar color="primary" class="app-toolbar" role="navigation" aria-label="Primary">
  <button class="nav__mobile-toggle" mat-icon-button [matMenuTriggerFor]="mobileMenu" aria-label="Open navigation">
    <mat-icon>menu</mat-icon>
  </button>
  <a class="nav__brand" [routerLink]="['/']" style="text-decoration:none; color:inherit; cursor:pointer;">
    <mat-icon aria-hidden="true">directions_car</mat-icon>
    <strong>Carsties</strong>
  </a>
  <nav class="nav__links" aria-label="Main">
    <button mat-button [routerLink]="['/search']">Buy</button>
    <button mat-button [routerLink]="['/sell']">Sell</button>
    <button mat-button [routerLink]="['/dealers']">Dealers</button>
    <button mat-button [routerLink]="['/']" fragment="reviews">Reviews</button>
  </nav>
  <span class="spacer"></span>
  <div class="nav__auth" *ngIf="isAuthenticated$ | async as isAuth">
    <ng-container *ngIf="!isAuth; else loggedInDesktop">
      <button mat-stroked-button (click)="login()">Login</button>
      <button mat-raised-button color="primary" [matMenuTriggerFor]="registerMenu">Register</button>
    </ng-container>
    <ng-template #loggedInDesktop>
      <button mat-button [routerLink]="['/my-listings']">My Listings</button>
      <button mat-stroked-button (click)="logout()">Logout</button>
    </ng-template>
    <a mat-button [routerLink]="['/sell']" class="link-sell">Sell your car</a>
    <mat-menu #registerMenu="matMenu">
      <button mat-menu-item (click)="register('Individual')">Register as Individual</button>
      <button mat-menu-item (click)="register('Dealer')">Register as Dealer</button>
    </mat-menu>
  </div>
</mat-toolbar>

<mat-menu #mobileMenu="matMenu">
  <button mat-menu-item [routerLink]="['/search']"><mat-icon>search</mat-icon> <span>Buy</span></button>
  <button mat-menu-item [routerLink]="['/sell']"><mat-icon>sell</mat-icon> <span>Sell</span></button>
  <button mat-menu-item [routerLink]="['/dealers']"><mat-icon>store</mat-icon> <span>Dealers</span></button>
  <button mat-menu-item [routerLink]="['/']" fragment="reviews"><mat-icon>star</mat-icon> <span>Reviews</span></button>
  <mat-divider></mat-divider>
  <button mat-menu-item *ngIf="!(isAuthenticated$ | async)" (click)="login()">Login</button>
  <button mat-menu-item *ngIf="!(isAuthenticated$ | async)" [matMenuTriggerFor]="registerMenu">Register</button>
  <button mat-menu-item *ngIf="isAuthenticated$ | async" (click)="logout()">Logout</button>
  <!-- Removed CTA button; keep primary Sell route in main links -->
</mat-menu>

<main class="page-container">
  <section class="page-content">
    <router-outlet></router-outlet>
  </section>
</main>

<app-footer></app-footer>
